[project]
name = "devsecops-ai"
version = "0.1.0"
description = "AI-assisted DevSecOps cockpit for IT owners and IT operations teams."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devsecops_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not live_llm\""
markers = [
    "live_llm: tests that call the live Claude API (deselected by default)",
]
